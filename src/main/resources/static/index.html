<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>OpenStreetMap with Leaflet</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <div id="search-form">
            <input type="text" id="station-input" placeholder="Recherche d'une station..."
                    oninput="suggestStations()" autocomplete="off" />
            <div id="suggestions" class="autocomplete-list"></div>
            <button onclick="searchStation()">Rechercher</button>
        </div>
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
        <script src="/js/map.js"></script>
        <script src="/js/autocomplete.js"></script>
    </body>
</html>
